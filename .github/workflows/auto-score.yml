name: Auto Score Matches (IPL + WWC)

# Calls POST /api/auto-score on Railway, which scores any new completed matches.
# IST = UTC+5:30.
on:
  # Runs are cheap: the app keeps the season schedule and only fetches matches
  # that started 4+ hours ago and aren't scored, so most runs make 0 API calls.
  # Only tournaments with status "live" are checked (none until WPL 2027).
  # Times cover evening matches (~7:30 PM IST, done ~11:30 PM) and afternoon
  # double-headers (~3:30 PM IST).
  schedule:
    - cron: "15 19 * * *"   # 12:45 AM IST: evening match
    - cron: "30 2  * * *"   # 8:00 AM IST: anything missed + Man of the Match retry
    - cron: "0  14 * * *"   # 7:30 PM IST: afternoon match
  workflow_dispatch:        # Manual trigger from GitHub UI still works

jobs:
  auto-score:
    name: Trigger auto-score on Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger auto-score (IPL + WWC)
        run: |
          echo "Triggering auto-score on Railway..."
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_APP_URL }}/api/auto-score" \
            -H "X-Api-Key: ${{ secrets.AUTOSCORE_API_KEY }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          # 202 = started, 409 = already running (both are fine)
          if [ "$RESPONSE" -ne 202 ] && [ "$RESPONSE" -ne 409 ]; then
            echo "ERROR: Unexpected HTTP status $RESPONSE"
            exit 1
          fi

      - name: Wait and check status
        run: |
          echo "Waiting 90 seconds for job to complete..."
          sleep 90

          echo "Checking auto-score status..."
          curl -s \
            "${{ secrets.RAILWAY_APP_URL }}/api/auto-score/status" \
            -H "X-Api-Key: ${{ secrets.AUTOSCORE_API_KEY }}" | python3 -m json.tool
